<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iHam element playground</title>
    <style>
      body {
        margin: 0;
        padding: 16px 24px;
        font-family: system-ui, sans-serif;
      }
      nav a {
        margin-right: 12px;
      }
      #log {
        font: 12px ui-monospace, monospace;
        color: #555;
      }
    </style>
    <!-- the real element build (dist/element): rebuilt in watch mode by the dev server, copied into the demo build -->
    <script src="./iham-element.iife.js"></script>
  </head>
  <body>
    <nav><strong>iHam 2 playground</strong> · <a href="./">Vue component</a><a href="./element.html">&lt;i-ham&gt; element</a></nav>
    <p>
      Plain HTML usage of the production bundle <code>dist/element/iham-element.iife.js</code>, with the data loaded
      live from the OMA browser (on the dev server through its proxy; the dev server also rebuilds the bundle on every
      change and reloads this page).
    </p>

    <!-- the data URLs are set below -->
    <i-ham id="viewer" query-hog="HOG:F0782425.2c.7a_207598" level="Homininae" preset="oma" height="60vh"></i-ham>

    <pre id="log"></pre>
    <script type="module">
      const log = document.getElementById("log");
      const viewer = document.getElementById("viewer");
      for (const name of ["loaded", "node-selected", "update:level", "hogs-removed", "error"]) {
        viewer.addEventListener(name, (e) => {
          const detail = e.detail;
          // abbreviate long arrays (e.g. the species list of node-selected)
          const text =
            typeof detail === "object"
              ? JSON.stringify(detail, (k, v) => (Array.isArray(v) && v.length > 5 ? `[${v.length} items]` : v))
              : detail;
          log.textContent = `${name}: ${text}\n` + log.textContent.split("\n").slice(0, 8).join("\n");
        });
      }

      // through the dev-server proxy, or straight from omabrowser.org in the demo build
      const oma = import.meta.env.DEV ? "" : "https://omabrowser.org";
      viewer.setAttribute("base-url", oma);
      viewer.setAttribute("orthoxml-url", `${oma}/oma/hog/HOG:F0782425.2c.7a/orthoxml/augmented/`);
      viewer.setAttribute("species-tree-url", `${oma}/All/speciestree.nwk`);
      viewer.setAttribute("fam-data-url", `${oma}/oma/hogdata/PROCO25562/json`);
    </script>
  </body>
</html>
